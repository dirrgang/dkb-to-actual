[tools]
python = "3.13"
uv = "0.13"
gh = "2"
prek = "0.5"

[env]
_.python.venv = { path = ".venv", create = false }

[tasks.install]
description = "Install the project and dev dependencies into .venv"
run = "uv sync --locked"

[tasks.fmt]
description = "Format and auto-fix code"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks.lint]
description = "Lint and check formatting"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.typecheck]
description = "Static type checking"
run = "uv run mypy"

[tasks.test]
description = "Run the test suite with coverage"
run = "uv run pytest"

[tasks.check]
description = "Run all checks (lint, typecheck, test)"
depends = ["lint", "typecheck", "test"]

[tasks.build]
description = "Build sdist and wheel into dist/"
run = "uv build"

[tasks.hooks]
description = "Install git hooks via prek"
run = "prek install"
