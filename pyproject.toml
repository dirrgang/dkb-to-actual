[project]
name = "dkb-to-actual"
version = "0.1.0"
description = "Convert DKB CSV exports (Girokonto, Tagesgeld, Kreditkarte) into CSV or OFX files for Actual Budget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dennis Irrgang" }]
requires-python = ">=3.12"
keywords = ["dkb", "actual", "actual-budget", "csv", "ofx", "banking", "budget"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: German",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = ["typer>=0.15"]

[project.urls]
Homepage = "https://github.com/dirrgang/dkb-to-actual"
Issues = "https://github.com/dirrgang/dkb-to-actual/issues"
Changelog = "https://github.com/dirrgang/dkb-to-actual/blob/main/CHANGELOG.md"

[project.scripts]
dkb-to-actual = "dkb_to_actual.cli:app"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "C4", "PT", "PTH", "RET", "ARG", "TC", "S", "DTZ",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "--cov=dkb_to_actual",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["src/dkb_to_actual/__main__.py"]
